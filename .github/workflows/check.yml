name: Check

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: assets/design/.check/.go-version
          cache: false
      - run: |
          before="${{ github.event.before }}"
          case "$before" in
          (''|0000000000000000000000000000000000000000) export CHECK_RANGE="$GITHUB_SHA^!" ;;
          (*) export CHECK_RANGE="$before..$GITHUB_SHA" ;;
          esac
          scripts/check
        env:
          CHECK_ACTOR: ${{ github.actor }}
